services:
  vote_service:
    image: ostepanyk/vote_service
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=database;Port=5432;Database=service;Username=postgres;Password=1q2w3e4r"
    networks:
      - microservices-network
    depends_on:
      - database
      - rabbitmq
  poll_service:
    image: shcherba/poll_service
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=pollDb;Uid=pollUser;Pwd=aseBaX123;"
    networks:
      - microservices-network
    depends_on:
      - mysql
  database:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1q2w3e4r
    ports:
      - "5432:5432"
    volumes:
      - ./db_schema.sql:/docker-entrypoint-initdb.d/db_schema.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - microservices-network
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pollDb
      MYSQL_USER: pollUser
      MYSQL_PASSWORD: aseBaX123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - microservices-network
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - microservices-network
networks:
  microservices-network:
    driver: bridge
volumes:
  postgres_data:
  mysql_data:
