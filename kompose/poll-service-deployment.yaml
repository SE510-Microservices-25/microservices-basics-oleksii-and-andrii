apiVersion: v1
kind: Secret
metadata:
  name: mysql-db-secret
type: Opaque
data:
  DbConnection: U2VydmVyPW15c3FsO1BvcnQ9MzMwNjtEYXRhYmFzZT1wb2xsRGI7VWlkPXBvbGxVc2VyO1B3ZD1hc2VCYVgxMjM7
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: poll-service
  name: poll-service
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: poll-service
  template:
    metadata:
      labels:
        io.kompose.service: poll-service
    spec:
      containers:
        - env:
            - name: RABBITMQ_HOST
              value: "rabbitmq"
            - name: RABBITMQ_USER
              value: "guest"
            - name: RABBITMQ_PASS
              value: "guest"
            - name: ASPNETCORE_ENVIRONMENT
              value: Development
            - name: ConnectionStrings__PollDbConnection
              valueFrom:
                secretKeyRef:
                  name: mysql-db-secret
                  key: DbConnection
          image: shcherba/poll_service
          name: poll-service
          ports:
            - containerPort: 8080
              protocol: TCP
      restartPolicy: Always
